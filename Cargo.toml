[package]
name = "tree-sitter-kof"
description = "Kof tree-sitter and higligth parser"
version = "0.1.0"
authors = ["Emerson A. Tieppo Jr. <tieppo.emerson.a.jr@gmail.com>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "kof"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/etieppo/tree-sitter-kof"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.11"
